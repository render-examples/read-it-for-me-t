previews:
  generation: automatic

services:
  - type: web
    name: read-it-for-me
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server/index.js
    healthCheckPath: /health
    envVars:
      - key: RENDER_API_KEY
        displayName: Render API Key
        description: Required to trigger Render Workflow tasks
        required: true
        sync: false
      - key: TOGETHER_API_KEY
        displayName: Together AI API Key
        description: Used to list chat models for the searchable picker
        required: true
        sync: false
      - key: TOGETHER_MODEL
        value: meta-llama/Llama-3.3-70B-Instruct-Turbo
        description: Default chat model when the picker has no selection
      - key: WORKFLOW_SLUG
        value: read-it-for-me-workflow
        description: Slug of the linked Workflow service
      - key: GITHUB_REPO_URL
        value: https://github.com/render-examples/read-it-for-me-t
      - key: DATABASE_URL
        fromDatabase:
          name: read-it-for-me-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: read-it-for-me-db
    plan: free
    postgresMajorVersion: "16"
